<mat-selection-list role="list" [multiple]="false">
  <mat-list-option role="listitem" *ngFor="let segment of segments$ | async">
    <div matLine>{{ segment.name }}</div>
    <span matLine class="text-secondary"
      >{{ segment.lamps }} lamps<ng-container *ngIf="segment.profile"
        >, {{ segment.profile }} profile</ng-container
      ></span
    >
  </mat-list-option>
</mat-selection-list>
