<device-filters
  [selected$]="filters$"
  (filterUpdateEvent)="updateFilter($event)"
></device-filters>

<mat-accordion>
  <ng-container *ngIf="profile$ | async as profile">
    <mat-expansion-panel
      id="category-profiles"
      *ngIf="profileUsage$ | async as usage"
      hideToggle
    >
      <mat-expansion-panel-header>
        <mat-panel-title>
          {{ usage.length === 1 ? "Profile" : "Profiles" }}
        </mat-panel-title>
        <mat-panel-description class="text-secondary">
          <div class="truncate">
            <ng-container *ngFor="let u of usage; let last = last"
              >{{ u.profile.name }}{{ last ? "" : ", " }}</ng-container
            >
          </div>
        </mat-panel-description>
      </mat-expansion-panel-header>
      <mat-action-list>
        <button
          mat-list-item
          *ngFor="let u of usage"
          [routerLink]="'../../../profiles/' + [u.profile.id]"
        >
          <div matLine>{{ u.profile.name }}</div>
          <div matLine>
            {{ u.lamps | i18nPlural: lampMapping
            }}{{ u.profile.id === profile.id ? " • group profile" : "" }}
          </div>
        </button>
        <button mat-list-item [matMenuTriggerFor]="profileMenu">Assign</button>
      </mat-action-list>
    </mat-expansion-panel>
  </ng-container>
  <!-- Subcategories for current selection -->
  <ng-container *ngIf="subgroups$ | async as subgroups">
    <mat-expansion-panel
      *ngIf="subgroups.length > 0"
      id="category-subcategories"
      hideToggle
    >
      <mat-expansion-panel-header>
        <mat-panel-title> Subcategories </mat-panel-title>
        <mat-panel-description class="text-secondary">
          <div class="truncate">
            <ng-container *ngFor="let sub of subgroups; let last = last"
              >{{ sub.group.name }}{{ last ? "" : ", " }}</ng-container
            >
          </div>
        </mat-panel-description>
      </mat-expansion-panel-header>
      <mat-action-list>
        <button
          mat-list-item
          *ngFor="let sub of subgroups"
          [routerLink]="'../' + [sub.group.id]"
        >
          <div matLine>{{ sub.group.name }}</div>
          <div matLine>{{ sub.lamps | i18nPlural: lampMapping }}</div>
        </button>
        <button mat-list-item>Add</button>
      </mat-action-list>
    </mat-expansion-panel>
  </ng-container>
</mat-accordion>

<!-- (click)="isEditable = !isEditable" -->
<button
  id="edit-toggle"
  type="button"
  aria-label="Toggle edit mode"
  (click)="openEditActions()"
  mat-icon-button
>
  <mat-icon svgIcon="editMedium"></mat-icon>
</button>

<group-list [category]="category"></group-list>

<ng-container>
  <!-- https://material.angular.io/components/select/overview#error-cannot-change-multiple-mode-of-select-after-initialization -->
  <mat-selection-list *ngIf="!isEditable" role="list" [multiple]="false">
    <mat-list-option
      [routerLink]="'../../device/' + [device.id]"
      role="listitem"
      *ngFor="let device of filteredDevices$ | async; trackBy: trackByDeviceId"
    >
      <div matLine>
        <mat-icon
          *ngIf="device.type == 'sensor'"
          inline
          [svgIcon]="
            device.sensor.type == 'env' ? 'treeRegular' : 'cameraRegular'
          "
          aria-hidden="true"
        ></mat-icon>
        <span>
          {{ device.type | i18nSelect: deviceTypeMap }}
          {{ device.name }}
        </span>
      </div>
      <span *ngIf="device.type !== 'sensor' && details[device.id]" matLine>{{
        details[device.id]
      }}</span>
    </mat-list-option>
    <mat-list-option role="listitem">
      <div class="text-secondary" matLine>Add</div>
    </mat-list-option>
  </mat-selection-list>
  <mat-selection-list
    [(ngModel)]="selectedDevices"
    *ngIf="isEditable"
    role="list"
  >
    <mat-list-option
      role="listitem"
      *ngFor="let device of filteredDevices$ | async; trackBy: trackByDeviceId"
    >
      <div matLine>{{ device.name }}</div>
      <span *ngIf="details[device.id]" matLine>{{ details[device.id] }}</span>
    </mat-list-option>
  </mat-selection-list>
</ng-container>

<mat-menu #profileMenu="matMenu">
  <button
    [disabled]="profile.id === (profile$ | async)?.id"
    *ngFor="let profile of profiles"
    mat-menu-item
  >
    {{ profile.name }}
  </button>
</mat-menu>
