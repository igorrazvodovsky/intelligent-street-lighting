<app-page-actions>
  Organisations
  <button mat-flat-button type="submit">Add organisation</button>
</app-page-actions>

<mat-selection-list role="list" [multiple]="false">
  <mat-list-option *ngFor="let city of cities" role="listitem">
    <div matLine>{{ city.name }}</div>
    <span matLine class="text-secondary">{{ city.country }}</span>
  </mat-list-option>
</mat-selection-list>
